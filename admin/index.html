<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Управление · ИН-25-1</title>
  <script>
    /* тема как в основном приложении (то же хранилище браузера) */
    try {var d=document.documentElement,ls=localStorage;var P=['en','sunset','forest','ocean','graphite','sakura','amoled'],F={sunset:'dark',forest:'light',ocean:'light',graphite:'dark',sakura:'light'};var p=ls.getItem('schedule-palette');if(P.indexOf(p)>=0)d.dataset.palette=p;var m=ls.getItem('schedule-mode')||(ls.getItem('schedule-theme')==='dark'?'dark':'light');var sys=false;try{sys=!!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);}catch(e){}var dark=F[p]?F[p]==='dark':(m==='dark'||(m==='system'&&sys));if(dark)d.dataset.theme='dark';} catch(e){}
  </script>
  <link rel="stylesheet" href="../css/app.css">
  <style>
    .adm-toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); max-width: 90vw; padding: 10px 16px; border-radius: 12px; background: var(--header, #182d49); color: #fffdf7; font-size: 14px; box-shadow: 0 8px 24px #0004; z-index: 80; }
    .adm-toast[hidden] { display: none; }
    .adm-back { position: fixed; inset: 0; z-index: 70; display: flex; align-items: flex-end; justify-content: center; background: #0007; }
    .adm-modal { width: min(560px, 100%); max-height: 92vh; overflow: auto; padding: 16px; border-radius: 18px 18px 0 0; background: var(--surface, #fff); color: var(--ink); }
    @media (min-width: 700px) { .adm-back { align-items: center; } .adm-modal { border-radius: 18px; } }
    .adm-field { display: flex; flex-direction: column; gap: 4px; margin: 8px 0; font-size: 13px; font-weight: 600; }
    .adm-day { margin: 14px 0 6px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
    .adm-diff, .adm-warn { margin: 10px 0; padding: 8px 12px; border-left: 3px solid var(--line); border-radius: 6px; }
    .adm-diff h4, .adm-warn h4 { margin: 0 0 4px; font-size: 14px; }
    .adm-diff.add { border-left-color: #2f9e6f; } .adm-diff.chg { border-left-color: #d9a21b; } .adm-diff.del { border-left-color: #c8102e; } .adm-warn { border-left-color: #d9a21b; }
    .adm-roles { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    .adm-roles button { border: 0; border-right: 1px solid var(--line); background: var(--button, transparent); color: var(--ink); padding: 7px 10px; font: inherit; font-size: 13px; cursor: pointer; }
    .adm-roles button:last-child { border-right: 0; }
    .adm-roles button[aria-pressed="true"] { background: var(--selected); color: var(--selected-text); font-weight: 650; }
  </style>
</head>
<body data-screen="owner">
  <header>
    <div class="inner">
      <p class="eyebrow">Расписание ИН-25-1</p>
      <h1>Управление</h1>
    </div>
  </header>
  <main id="admin-root" class="owner-shell"></main>
  <div id="adm-toast" class="adm-toast" role="status" aria-live="polite" hidden></div>
  <script src="../js/telegram.js"></script>
  <script src="./loader.js"></script>
</body>
</html>
